name: build

# Builds with the stock .NET Framework 4.x csc.exe (no NuGet, no MSBuild), runs the
# offline self-test, then starts the server on a scratch port and exercises the
# pages, the API and the admin board.

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe from .NET Framework 4.x not found" }
          "csc: $csc"
          (Get-Item $csc).VersionInfo.FileVersion
          "PS: " + $PSVersionTable.PSVersion

      - name: Build, self-test and HTTP checks
        shell: powershell
        run: .\tools\ci-test.ps1

      - name: Package
        if: success()
        shell: pwsh
        run: |
          # config.ini holds a generated admin token and the secrets - never ship it.
          # The server recreates it from config.example.ini on first start.
          Remove-Item bin\config.ini -ErrorAction SilentlyContinue
          Remove-Item bin\data\* -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item bin\logs\*.log -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path bin\data | Out-Null
          Compress-Archive -Path bin\* -DestinationPath dig-win.zip -Force
          Get-Item dig-win.zip | Select-Object Name, Length

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dig-win
          path: dig-win.zip
          if-no-files-found: error

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: bin/logs
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME dig-win.zip --title $env:GITHUB_REF_NAME --generate-notes
          } else {
            gh release upload $env:GITHUB_REF_NAME dig-win.zip --clobber
          }
